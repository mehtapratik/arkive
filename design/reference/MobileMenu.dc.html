<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["auto","light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const t = (this.state && this.state.theme) || this.props.theme || 'light';
return {
theme: t,
pAuto: String(t === 'auto'), pLight: String(t === 'light'), pDark: String(t === 'dark'),
setAuto: () => this.setState({ theme: 'auto' }),
setLight: () => this.setState({ theme: 'light' }),
setDark: () => this.setState({ theme: 'dark' })
};
}
}
</script>
